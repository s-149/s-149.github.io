<html lang="id">

<head>

    <meta charset="UTF-8">

        name="viewport"

    <title>Cek Nomor Antrian</title>


    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            opacity: 0.9;

        }


        .today {

            margin-top: 15px;

            font-size: 13px;

            color: #999;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>🎫 Cek Nomor Antrian</h1>


    <div class="description">

        Masukkan nomor WhatsApp kamu
        untuk melihat nomor antrian hari ini.

    </div>


    <input
        type="tel"
        id="phone"
        placeholder="08xxxxxxxxxx"
        autocomplete="tel"
    >


    <button onclick="checkQueue()">

        🔍 Cek Nomor Antrian

    </button>


    <div
        class="today"
        id="todayText"
    ></div>

</div>



<script>


// =====================================================
// CONFIG
// =====================================================

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw0XlzBFlH88etCJXMG5PCXGloan7sPV5-PHrWO623RXC2qL6sK2d8Hnesbz-GEH7M/exec";


// =====================================================
// GET TODAY
// Format:
// yyyy/MM/dd
// =====================================================

function getToday() {

    const now = new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return `${year}/${month}/${day}`;
}


// =====================================================
// NORMALIZE PHONE
// =====================================================

function normalizePhone(phone) {

    phone = String(phone)
        .trim()
        .replace(/\s+/g, "")
        .replace(/-/g, "");


    // +628...
    if (phone.startsWith("+62")) {

        phone =
            "62" +
            phone.substring(3);

    }


    // 08...
    else if (phone.startsWith("0")) {

        phone =
            "62" +
            phone.substring(1);

    }


    return phone;
}


// =====================================================
// SHOW TODAY
// =====================================================

document.getElementById("todayText").innerText =
    "Tanggal hari ini: " + getToday();


// =====================================================
// CHECK QUEUE
// =====================================================

async function checkQueue() {

    const input =
        document.getElementById("phone");


    const rawPhone =
        input.value.trim();


    // ================================================
    // VALIDASI INPUT
    // ================================================

    if (!rawPhone) {

        Swal.fire({

            icon: "warning",

            title: "Nomor WhatsApp kosong",

            text:
                "Silakan masukkan nomor WhatsApp kamu."

        });

        return;
    }


    // ================================================
    // NORMALIZE PHONE
    // ================================================

    const phone =
        normalizePhone(rawPhone);


    // ================================================
    // VALIDASI NOMOR
    // ================================================

    if (
        !/^62\d{8,15}$/.test(phone)
    ) {

        Swal.fire({

            icon: "warning",

            title: "Nomor tidak valid",

            text:
                "Contoh: 081234567890"

        });

        return;
    }


    // ================================================
    // TODAY
    // ================================================

    const today =
        getToday();


    // ================================================
    // SHOW LOADING
    // ================================================

    Swal.fire({

        title: "Mencari data...",

        text:
            "Mohon tunggu sebentar.",

        allowOutsideClick: false,

        didOpen: () => {

            Swal.showLoading();

        }

    });


    // ================================================
    // BUILD REQUEST
    // ================================================

    const url =
        APPS_SCRIPT_URL +
        "?phone=" +
        encodeURIComponent(phone) +
        "&date=" +
        encodeURIComponent(today);


    console.log(
        "Lookup URL:",
        url
    );


    try {

        // ============================================
        // REQUEST GOOGLE APPS SCRIPT
        // ============================================

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Response:",
            result
        );


        // ============================================
        // FOUND
        // ============================================

        if (
            result.success === true &&
            result.status === "FOUND"
        ) {

            const data =
                result.data;


            Swal.fire({

                icon: "success",

                title:
                    "🎫 Nomor Antrian Kamu",

                html: `

                    <div style="
                        margin-top:10px;
                        color:#777;
                        font-size:14px;
                    ">
                        ${data.nama || ""}
                    </div>


                    <div style="
                        margin:20px 0;
                        font-size:56px;
                        font-weight:bold;
                        color:#667eea;
                    ">
                        ${data.no_antrian}
                    </div>


                    <div style="
                        font-size:14px;
                        color:#777;
                    ">
                        ${data.tanggal}
                    </div>

                `,

                confirmButtonText:
                    "OK"

            });


            return;
        }


        // ============================================
        // NOT FOUND
        // ============================================

        if (
            result.status === "NOT_FOUND"
        ) {

            Swal.fire({

                icon: "info",

                title:
                    "Data belum ditemukan",

                html: `

                    <p>
                        Belum ditemukan nomor antrian
                        untuk nomor:
                    </p>

                    <b>
                        ${phone}
                    </b>

                    <p style="
                        margin-top:15px;
                        color:#777;
                    ">
                        Tanggal:
                        ${today}
                    </p>

                `,

                confirmButtonText:
                    "OK"

            });


            return;
        }


        // ============================================
        // INVALID
        // ============================================

        if (
            result.status === "INVALID"
        ) {

            Swal.fire({

                icon: "warning",

                title:
                    "Parameter tidak valid",

                text:
                    result.message ||
                    "Data yang dikirim tidak valid."

            });


            return;
        }


        // ============================================
        // ERROR
        // ============================================

        Swal.fire({

            icon: "error",

            title:
                "Terjadi kesalahan",

            text:
                result.message ||
                "Tidak dapat mengambil data."

        });


    } catch (error) {

        console.error(
            "Lookup error:",
            error
        );


        Swal.fire({

            icon: "error",

            title:
                "Gagal mengambil data",

            text:
                "Tidak dapat terhubung ke server."

        });

    }

}

</script>


</body>

</html>
